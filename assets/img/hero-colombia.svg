       Sustituir por el asset exportado desde Figma conservando el mismo nombre. -->
  <rect width="460" height="630" fill="#173B72"/>
  <g fill="none" stroke="#FFFDF7" stroke-opacity="0.28" stroke-width="2" stroke-linejoin="round">
    <path d="M-20 470 L110 330 L200 430 L280 340 L480 500"/>
    <path d="M-20 540 L120 420 L210 500 L300 420 L480 560"/>
  </g>
  <g fill="#FFFDF7" fill-opacity="0.75" font-family="Poppins, Segoe UI, sans-serif" text-anchor="middle">
