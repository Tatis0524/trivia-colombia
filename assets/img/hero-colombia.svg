    <text x="230" y="330" font-size="15" fill="#FFFDF7" fill-opacity="0.6">Exportar desde Figma a</text>
    <text x="230" y="352" font-size="15" fill="#FFFDF7" fill-opacity="0.6">assets/img/hero-colombia.svg</text>
